<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{normal/baseN::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>USER Porfile</title>

<link rel="stylesheet" th:href="@{/css/style.css}" />

<style>
body {
	background-color: #f8f9fa;
}

.profile-img {
	width: 140px;
	height: 140px;
	object-fit: cover;
	border-radius: 50%;
	border: 3px solid #0d6efd;
}

.label-title {
	font-weight: 600;
	color: #6c757d;
}

.value-text {
	font-size: 1.05rem;
}
</style>
</head>

<body>
	<section>

		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-lg-8">

					<div class="card shadow-sm">

						<!-- Header -->
						<div class="card-header bg-primary text-white text-center">
							<h4 class="mb-0">👤 User Profile</h4>
							<small>Professional Details about User</small>
						</div>

						<div class="card-body">

							<!-- Profile Image -->
							<div class="text-center mb-4">
								<img th:if="${user.image != null}"
									th:src="@{'/img/' + ${user.image}}" alt="User Image"
									class="image_show_profile" /> <img
									th:if="${user.image == null}" src="/img/default-user.png"
									alt="Default Image" class="image_show_profile" />
							</div>

							<!-- USER Info -->
							<div class="mt-3 px-3">

								<div class="field-row">
									<div class="label-title">Full Name</div>
									<div class="value-text" th:text="${user.name}"></div>
								</div>

								<div class="field-row">
									<div class="label-title">Email</div>
									<div class="value-text">
										<a th:href="'mailto:' + ${user.email}"
											th:text="${user.email}"></a>
									</div>
								</div>

								<div class="field-row">
									<div class="label-title">Number of Contacts</div>
									<div class="value-text" th:text="${user.contacts.size()}"></div>
								</div>

							</div>


							<!-- Description -->
							<div class="mt-4">
								<div class="label-title mb-2">About</div>
								<div class="border rounded p-3 bg-light"
									th:utext="${user.information != null ? user.information : 'No description available'}">
								</div>
							</div>
						</div>
					</div>

				</div>
			</div>
		</div>

	</section>
</body>
</html>
