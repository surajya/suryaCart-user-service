<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{normal/baseN::layout(~{::section})}">
<head>
<meta charset="UTF-8">
<title>View Contact</title>

<link rel="stylesheet" th:href="@{/css/style.css}" />

<style>
body {
	background-color: #f8f9fa;
}

.profile-img {
	width: 140px;
	height: 140px;
	object-fit: cover;
	border-radius: 50%;
	border: 3px solid #0d6efd;
}

.label-title {
	font-weight: 600;
	color: #6c757d;
}

.value-text {
	font-size: 1.05rem;
}
</style>
</head>

<body>
	<section>

		<div class="container mt-4">
			<div class="row justify-content-center">
				<div class="col-lg-8">

					<div class="card shadow-sm">

						<!-- Header -->
						<div class="card-header bg-primary text-white text-center">
							<h4 class="mb-0">👤 Contact Details</h4>
							<small>Professional contact information</small>
						</div>

						<div class="card-body">

							<!-- Profile Image -->
							<div class="text-center mb-4">
								<img th:if="${contact.imageId != null}"
									th:src="@{'/img/' + ${contact.imageId}}" alt="Contact Image"
									class="image_show_profile" /> <img
									th:if="${contact.imageId == null}" src="/img/default-user.png"
									alt="Default Image" class="image_show_profile" />
							</div>

							<!-- Contact Info -->
							<div class="mt-3 px-3">

								<div class="field-row">
									<div class="label-title">Full Name</div>
									<div class="value-text" th:text="${contact.name}"></div>
								</div>

								<div class="field-row">
									<div class="label-title">Nickname</div>
									<div class="value-text"
										th:text="${contact.nickname != null ? contact.nickname : '-'}"></div>
								</div>

								<div class="field-row">
									<div class="label-title">Profession</div>
									<div class="value-text"
										th:text="${contact.work != null ? contact.work : '-'}"></div>
								</div>

								<div class="field-row">
									<div class="label-title">Email</div>
									<div class="value-text">
										<a th:href="'mailto:' + ${contact.email}"
											th:text="${contact.email}"></a>
									</div>
								</div>

								<div class="field-row">
									<div class="label-title">Phone Number</div>
									<div class="value-text" th:text="${contact.phoneNumber}"></div>
								</div>

							</div>


							<!-- Description -->
							<div class="mt-4">
								<div class="label-title mb-2">About</div>
								<div class="border rounded p-3 bg-light"
									th:utext="${contact.description != null ? contact.description : 'No description available'}">
								</div>
							</div>

							<!-- Actions -->
							<div class="d-flex justify-content-center gap-3 mt-4">
								<a th:href="@{'/userControll/edit-contact/' + ${contact.id}}"
									class="btn btn-outline-primary"> ✏️ Edit </a> <a
									th:href="@{/userControll/contacts}"
									class="btn btn-outline-secondary"> 🔙 Back </a>
							</div>

						</div>
					</div>

				</div>
			</div>
		</div>

	</section>
</body>
</html>
